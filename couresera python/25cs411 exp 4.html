<!DOCTYPE html>
<html>
<head>
  <title>Simple Form Validation</title>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg, #0b2a3e, #1a4f68);
      color: #eef3f7;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 350px;
      margin: 50px auto;
      background: rgba(255, 255, 255, 0.18);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
    }

    button {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      background-color: #3366cc;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #254a99;
    }
  </style>

  <script>
    function validateForm() {
      let name = document.getElementById("name").value;
      let email = document.getElementById("email").value;
      let phone = document.getElementById("phone").value;

      // Simple email pattern
      let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

      // Simple phone number pattern (10 digits)
      let phonePattern = /^[0-9]{10}$/;

      if (name === "" || email === "" || phone === "") {
        alert("All fields are mandatory!");
      }
      else if (!email.match(emailPattern)) {
        alert("Please enter a valid email address!");
      }
      else if (!phone.match(phonePattern)) {
        alert("Phone number must contain exactly 10 digits!");
      }
      else {
        alert("Validation successful!");
      }
    }

    function showData() {
      let name = document.getElementById("name").value;
      let email = document.getElementById("email").value;
      let phone = document.getElementById("phone").value;

      alert(
        "Name: " + name + "\n" +
        "Email: " + email + "\n" +
        "Phone: " + phone
      );
    }

    function clearForm() {
      document.getElementById("name").value = "";
      document.getElementById("email").value = "";
      document.getElementById("phone").value = "";
    }

    function showJavaScriptInfo() {
      const info = `JavaScript enables interactive web pages.

` +
        `This example shows:
` +
        `- Form validation (checking empty fields, email format, phone format)
` +
        `- Using DOM methods (getElementById, value)
` +
        `- Running functions on button clicks`;

      alert(info);
    }
  </script>
</head>

<body>

  <div class="container">
    <h3 align="center">Registration Form</h3>
    <p style="font-size: 14px; color: rgba(0,0,0,0.6);">
      This form uses JavaScript for client-side validation and interaction. Try submitting with invalid values to see the feedback.
    </p>

    <input type="text" id="name" placeholder="Enter Name">
    <input type="email" id="email" placeholder="Enter Email">
    <input type="text" id="phone" placeholder="Enter Phone Number">

    <button onclick="validateForm()">Validate</button>
    <button onclick="showData()">Show Data</button>
    <button onclick="showJavaScriptInfo()">About JS</button>
    <button onclick="clearForm()">Clear</button>
  </div>

</body>
</html>
