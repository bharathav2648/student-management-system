<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeScript OOP Demo</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #f8fafc 0%, #dbeafe 40%, #e2e8f0 100%);
            color: #0f172a;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: grid;
            place-items: center;
            padding: 32px;
        }

        .card {
            width: min(920px, 100%);
            background: #ffffff;
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 32px;
            padding: 36px 40px;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: clamp(2rem, 2.5vw, 2.8rem);
            color: #111827;
        }

        p {
            margin: 0 0 1.75rem;
            color: #475569;
            max-width: 72ch;
            line-height: 1.75;
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 0.95rem 1.7rem;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #0ea5e9, #22c55e);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 1.5rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 35px rgba(16, 185, 129, 0.2);
        }

        pre {
            background: #f8fafc;
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 24px;
            padding: 24px;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
            color: #0f172a;
            margin: 0;
            min-height: 250px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>TypeScript EV Car Demo</h1>
        <p>This demo uses TypeScript classes to model electric vehicles, show inheritance and interfaces, and print EV details in the browser.</p>
        <button id="runBtn">Run Demo</button>
        <pre id="result">Click "Run Demo" to execute the TypeScript application.</pre>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/typescript@5.6.2/lib/typescript.js"></script>
    <script id="ts-source" type="text/plain">
abstract class Vehicle {
    static inventoryName = 'City Car Fleet';
    readonly vin: string;
    protected make: string;
    protected model: string;
    protected year: number;

    constructor(vin: string, make: string, model: string, year: number) {
        this.vin = vin;
        this.make = make;
        this.model = model;
        this.year = year;
    }

    get displayName(): string {
        return `${this.year} ${this.make} ${this.model}`;
    }

    abstract getDetails(): string;
}

interface Insurable {
    getInsuranceEstimate(): number;
}

class Car extends Vehicle {
    private bodyType: string;
    private engineType: string;

    constructor(vin: string, make: string, model: string, year: number, bodyType: string, engineType: string) {
        super(vin, make, model, year);
        this.bodyType = bodyType;
        this.engineType = engineType;
    }

    getDetails(): string {
        return `${this.displayName} | Body: ${this.bodyType} | Engine: ${this.engineType}`;
    }
}

class ElectricCar extends Vehicle implements Insurable {
    private batteryCapacity: number;
    private rangeKm: number;
    private basePrice: number;

    constructor(vin: string, make: string, model: string, year: number, batteryCapacity: number, rangeKm: number, basePrice: number) {
        super(vin, make, model, year);
        this.batteryCapacity = batteryCapacity;
        this.rangeKm = rangeKm;
        this.basePrice = basePrice;
    }

    getDetails(): string {
        return `${this.displayName} | Battery: ${this.batteryCapacity} kWh | Range: ${this.rangeKm} km`;
    }

    getInsuranceEstimate(): number {
        return Math.round(this.basePrice * 0.015);
    }
}

function printVehicleInfo(vehicle: Vehicle): string {
    return `VIN: ${vehicle.vin} | ${vehicle.getDetails()}`;
}

function runDemo(): void {
    const vehicles: Vehicle[] = [
        new ElectricCar('5YJ3E1EA7KF317123', 'Tesla', 'Model 3', 2024, 82, 530, 42000),
        new ElectricCar('7SAYGDEE4NK123456', 'Lucid', 'Air Touring', 2024, 112, 660, 90000),
        new ElectricCar('WVWXB7AU8EW123789', 'Volkswagen', 'ID.4', 2023, 77, 400, 45000),
    ];

    const outputLines = [
        `Inventory: ${Vehicle.inventoryName}`,
        '--- EV Car Details Demo ---',
    ];

    vehicles.forEach(vehicle => {
        outputLines.push(printVehicleInfo(vehicle));
        if ('getInsuranceEstimate' in vehicle) {
            const insured = vehicle as Insurable;
            outputLines.push(`Estimated insurance: $${insured.getInsuranceEstimate()}`);
        }
    });

    const resultElement = document.getElementById('result');
    if (resultElement) {
        resultElement.textContent = outputLines.join('\n');
    }
}
    </script>

    <script>
        const runBtn = document.getElementById('runBtn');
        const tsSource = document.getElementById('ts-source');

        if (runBtn && tsSource && typeof ts !== 'undefined') {
            runBtn.addEventListener('click', () => {
                const code = tsSource.textContent || '';
                const compiled = ts.transpileModule(code, {
                    compilerOptions: {
                        target: ts.ScriptTarget.ES2020,
                        module: ts.ModuleKind.ES2020,
                        noImplicitAny: false,
                        strict: false
                    }
                }).outputText;

                const fn = new Function('document', `${compiled}\nreturn runDemo();`);
                fn(document);
            });
        }
    </script>
</body>
</html>
