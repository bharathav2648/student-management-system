<!DOCTYPE html>
<html>
    <head> <title>welcome to js</title></head>
    <body>
        <h1>   Welcome to JavaScript</h1>
        <p>JavaScript is a versatile programming language used for web development, allowing you to create interactive and dynamic web pages.</p>
        <input type="text" id="name" placeholder="Enter your name"> 
        <button onclick="greet()">Greet Me</button>
        <script>
            function greet() {
                var name = document.getElementById("name").value;
                alert("Hello, " + name + "! its good to see you.");
            }
        </script>
        <br><br>    
          
        <button onclick= "show()">Click Me</button>
        <script>
            function show()
            {
                alert("leave this site immediately");
            }

        </script>
    </body>
</html>
