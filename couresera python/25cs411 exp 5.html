<!DOCTYPE html>
<html>
<head>
    <title>DOM Manipulation - Multiple Buttons</title>

    <style>
        body {
            font-family: Georgia, serif;
            text-align: center;
            margin-top: 50px;
            background-color:  #03032e;
            color: rgb(255, 255, 255);
        }

        p {
            font-size: 18px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            background-color: #000000;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #254a99;
        }
    </style>

    <script>
        function changeText() {
            document.getElementById("message").innerHTML =
                "The text has been changed using JavaScript!";
        }

        function changeColor() {
            document.getElementById("message").style.color = "red";
        }

        function resetContent() {
            document.getElementById("message").innerHTML =
                "Click the buttons to perform operations.";
            document.getElementById("message").style.color = "white";
        }

        function updateMessage() {
            var inputText = document.getElementById("textInput").value;
            document.getElementById("message").innerHTML = inputText;
            document.getElementById("message").style.color = "white";
        }
    </script>
</head>

<body>

    <h2>JavaScript DOM Manipulation</h2>

    <p id="message">Click the buttons to perform operations.</p>

    <button onclick="changeText()">Change Text</button>
    <button onclick="changeColor()">Change Color</button>
    <button onclick="resetContent()">Reset</button>

    <br><br>

    <input type="text" id="textInput" placeholder="Enter text here...">
    <button onclick="updateMessage()">Update Message</button>

</body>
</html>
