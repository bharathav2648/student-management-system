<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async API Demo</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 40px 24px;
            background: radial-gradient(circle at top, rgba(59, 130, 246, 0.16), transparent 32%),
                        linear-gradient(180deg, #020617 0%, #0f172a 100%);
            color: #e2e8f0;
        }

        main {
            margin: 0 auto;
            max-width: 900px;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: clamp(2rem, 3vw, 3rem);
            letter-spacing: -0.04em;
            color: #ffffff;
        }

        p {
            margin: 0 0 1.5rem;
            color: #cbd5e1;
            max-width: 32rem;
        }

        .card {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.35);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            margin-bottom: 1.75rem;
        }

        button {
            padding: 0.95rem 1.6rem;
            font-size: 1rem;
            line-height: 1.2;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
            box-shadow: 0 14px 30px rgba(56, 189, 248, 0.18);
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 20px 34px rgba(59, 130, 246, 0.22);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
        }

        #output {
            width: 100%;
            min-height: 320px;
            border-radius: 20px;
            border: 1px solid rgba(148, 163, 184, 0.16);
            background: #020617;
            padding: 24px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
            color: #cbd5e1;
        }

        .status-line {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            color: #38bdf8;
        }

        .status-line strong {
            color: #ffffff;
        }

        .message {
            color: #cbd5e1;
            margin-bottom: 0.6rem;
        }

        .error {
            color: #fb7185;
            margin-bottom: 0.6rem;
        }
    </style>
</head>
<body>
    <main>
        <div class="card">
            <h1>JavaScript Fetch API Demo</h1>
            <p>Click the button below to trigger an asynchronous GET and POST flow using modern JavaScript.</p>
            <div class="controls">
                <button id="runBtn">Run API Demo</button>
            </div>
            <div id="output">Results will appear here...</div>
        </div>
    </main>

    <script>
        const outputDiv = document.getElementById('output');
        const runBtn = document.getElementById('runBtn');

        // Helper to display text on the screen
        function logToUI(message, isError = false) {
            const span = document.createElement('div');
            span.className = isError ? 'error' : 'message';
            span.innerHTML = message;
            outputDiv.appendChild(span);
        }

        // 1. GET Request
        async function fetchPosts() {
            const url = 'https://jsonplaceholder.typicode.com/posts?_limit=3';
            const englishTitles = [
                'A quick introduction to asynchronous fetching',
                'Why network requests are important',
                'How JavaScript handles API responses'
            ];

            try {
                logToUI("<strong>--- Fetching Posts ---</strong>");
                const response = await fetch(url);

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const posts = await response.json();
                
                posts.forEach((post, index) => {
                    const title = englishTitles[index] || 'Sample post title in English';
                    logToUI(`Post #${post.id}: ${title}`);
                });
                
                return posts;
            } catch (error) {
                logToUI(`Fetch failed: ${error.message}`, true);
            }
        }

        // 2. POST Request
        async function createNewPost(title, body) {
            const url = 'https://jsonplaceholder.typicode.com/posts';
            try {
                logToUI("<br><strong>--- Creating New Post ---</strong>");
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-type': 'application/json; charset=UTF-8' },
                    body: JSON.stringify({ title, body, userId: 1 }),
                });

                if (!response.ok) throw new Error("Failed to create post");

                const result = await response.json();
                logToUI(`Success! New Post created with ID: ${result.id}`);
                return result;
            } catch (error) {
                logToUI(`Post failed: ${error.message}`, true);
            }
        }

        // 3. Orchestration triggered by Button
        runBtn.addEventListener('click', async () => {
            // Reset UI
            outputDiv.innerHTML = "";
            runBtn.disabled = true;
            runBtn.innerText = "Loading...";

            await fetchPosts();
            await createNewPost("Hello from Fetch", "This POST request demonstrates sending JSON data using async/await.");

            logToUI("<br><strong>Demo Complete.</strong>");
            runBtn.disabled = false;
            runBtn.innerText = "Run API Demo";
        });
    </script>
</body>
</html>
