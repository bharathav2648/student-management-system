<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Enhancements - Shadows, Borders, Backgrounds</title>
  
  <style>
    /* Multiple background images */
   
      
        body {
  background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
    url("file:///C:/Users/vasan/OneDrive/Desktop/Wallpaper/ichigo-kurosaki-5120x2880-10503.jpg");
  
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  height: 100vh;
  margin: 0;
}
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      
    

    /* Header styling with text-shadow */
   header {
  text-align: center;
  padding: 30px;
  background-color: transparent; /* Makes the background invisible */
  box-shadow: none; /* Usually looks better without a shadow if transparent */
}

    header h1 {
      color: #333;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      font-size: 34px;
    }

    /* Card Box with shadow and rounded border */
    .card {
      background-color: white;
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
      max-width: 600px;
      margin: 50px auto;
      padding: 30px;
      text-align: center;
    }

    .card img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(195, 21, 21, 0.3);
      margin-bottom: 20px;
    }

    .card p {
      font-size: 17px;
      color: #020d04;
    }

    /* Footer styling */
    footer {
      text-align: center;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      font-size: 16px;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }

    footer p {
      margin: 0;
    }
  </style>
</head>

<body>
  <header>
    <h1>CSS Enhancements Demo</h1>
  </header>

  <div class="card">
    <img src="https://cdn-icons-png.flaticon.com/512/147/147144.png" alt="User Avatar">
    <h2 style="color:#3366cc;">Welcome to CSS Styling</h2>
    <p>
      This webpage demonstrates <b>shadows</b>, <b>rounded borders</b>, 
      and <b>multiple background images</b> using CSS3.
    </p>
  </div>

  <footer>
    <p>&copy; 2025 Application Development Practices Lab</p>
  </footer>
</body>
</html>
