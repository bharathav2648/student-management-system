<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Background Style</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .hero-bg {
            /* Replace the URL with any valid image link */
            background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b');
            height: 100vh;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .content {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .content img {
            max-width: 280px;
            width: 100%;
            border-radius: 8px;
            margin-top: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="hero-bg">
        <div class="content">
            <h1>Welcome to My Website</h1>
            <p>This page features a full-screen background image.</p>
            <img src="https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d?auto=format&fit=crop&w=800&q=80" alt="Decorative landscape image">
        </div>
    </div>
</body>
</html>
